name: Build and Publish npm Package (reusable prototype)

# Prototype here before extracting the generic build/artifact/OIDC jobs to release-workflows.
# The caller owns triggers and the npm trusted-publisher identity.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        type: string
        default: ""
      snapshot:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      environment:
        type: string
        default: npm-snapshots

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "21"
          distribution: temurin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Determine the shared npm version
        id: version
        env:
          NPM_VERSION: ${{ inputs.version }}
          SNAPSHOT: ${{ inputs.snapshot }}
          SNAPSHOT_BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$SNAPSHOT" != true ]]; then unset SNAPSHOT_BUILD; fi
          VERSION="$(node scripts/npm-package.mjs version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test publication version rules
        run: node --test scripts/npm-package.test.mjs
      - name: Build, test both transports, and pack through Gradle
        env:
          NPM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build npmPack -PuseLocalDependencies=false "-PnpmVersion=$NPM_VERSION"
      - name: Verify the tarball and exercise the installed Node server
        env:
          NPM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/npm-package.mjs verify "$NPM_VERSION"
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          npm install --prefix "$RUNNER_TEMP/npm-smoke" --ignore-scripts --no-audit --no-fund \
            "$PWD/build/npm/zenwave360-lsp-js-$NPM_VERSION.tgz"
          LSP_JS_PACKAGE_DIR="$RUNNER_TEMP/npm-smoke/node_modules/@zenwave360/lsp-js" \
            node --test lsp-js/npm/test/node-ipc.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: build/npm/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-package-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: build/npm
      - name: Publish the tested tarball using OIDC
        env:
          NPM_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/npm-package.mjs publish "$NPM_VERSION"
