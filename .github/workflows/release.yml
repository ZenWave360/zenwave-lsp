name: Release npm Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag version without v (e.g. 0.1.0 or 0.1.0-rc.1)"
        required: true
        type: string
      publishNpm:
        description: "Publish the tested package (disable to download the tarball only)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/v{0}', inputs.version) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Validate the tagged shared release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch && "$DISPATCH_REF" != refs/heads/main ]]; then
            echo "::error::Dispatch release.yml from main. The version input selects the existing release tag."
            exit 1
          fi
          VERSION="$(node scripts/npm-package.mjs release-version "${RELEASE_TAG#v}")"
          COMMIT="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::The release tag must point at a commit integrated into main."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  npm-package:
    needs: validate
    uses: ./.github/workflows/npm-package.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}
      version: ${{ needs.validate.outputs.version }}
      snapshot: false
      publish: ${{ github.event_name == 'push' || inputs.publishNpm }}
      environment: npm-publish
      # Keep the source dependency aligned with the snapshot caller.
      dsl-ref: 835a75fdb7b798fa382f90fb3c109de74d1e1115
