name: Release

run-name: "Release v${{ inputs.version }} from main"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release without v (e.g. 0.1.0 or 0.1.0-rc.1)"
        required: true
        type: string
      developmentVersion:
        description: "Next development version; leave empty to derive the next SNAPSHOT"
        type: string
        default: ""
      publishNpm:
        description: "Publish the npm package (requires npm-publish environment approval)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: inputs.publishNpm
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: inputs.publishNpm
        with:
          node-version: "24"
      - name: Check registry before preparing the shared release
        if: inputs.publishNpm
        env:
          NPM_VERSION: ${{ inputs.version }}
        run: node scripts/npm-package.mjs check-release "$NPM_VERSION"

  release:
    needs: validate-npm
    uses: ZenWave360/release-workflows/.github/workflows/release-gradle.yml@e1f06ae5734cf790487acfa1f48f39f3e78aef39
    with:
      version: ${{ inputs.version }}
      development-version: ${{ inputs.developmentVersion }}
      artifact-id: lsp-core
      java-version: "21"
      node-version: "24"
      gradle-arguments: "--refresh-dependencies -PuseLocalDependencies=false"
      snapshot-workflow: publish-npm-snapshots.yml
      publish-npm: false
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}

  npm-packages:
    needs: release
    uses: ZenWave360/release-workflows/.github/workflows/npm-packages.yml@e1f06ae5734cf790487acfa1f48f39f3e78aef39
    with:
      ref: ${{ format('refs/tags/v{0}', inputs.version) }}
      version: ${{ inputs.version }}
      npm-script: scripts/npm-package.mjs
      gradle-arguments: "--refresh-dependencies -PuseLocalDependencies=false"
      publish: ${{ inputs.publishNpm }}
      environment: npm-publish
