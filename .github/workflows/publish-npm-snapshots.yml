name: Build and Publish Snapshots

# Preserve this caller filename: npm trusted publishing uses its identity.
on:
  push:
    branches: [develop, next]
  workflow_dispatch:
    inputs:
      publishNpm:
        description: "Publish the npm snapshot to next (disable to download the tarball only)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: maven-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-snapshot:
    if: vars.PUBLISH_MAVEN == 'true'
    uses: ZenWave360/release-workflows/.github/workflows/publish-snapshots-gradle.yml@e1f06ae5734cf790487acfa1f48f39f3e78aef39
    with:
      java-version: "21"
      node-version: "24"
      gradle-arguments: "--refresh-dependencies -PuseLocalDependencies=false"
      kover-xml-files: >-
        ./lsp-core/build/reports/kover/report.xml
        ./lsp-jvm/build/reports/kover/report.xml
      publish-npm: false
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}

  npm-packages:
    needs: publish-snapshot
    if: >-
      always() && !cancelled() &&
      (needs.publish-snapshot.result == 'success' || needs.publish-snapshot.result == 'skipped') &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/next')
    uses: ZenWave360/release-workflows/.github/workflows/npm-packages.yml@e1f06ae5734cf790487acfa1f48f39f3e78aef39
    with:
      ref: ${{ github.sha }}
      npm-script: scripts/npm-package.mjs
      gradle-arguments: "--refresh-dependencies -PuseLocalDependencies=false"
      snapshot: true
      publish: ${{ github.event_name == 'push' || inputs.publishNpm }}
      environment: npm-snapshots
